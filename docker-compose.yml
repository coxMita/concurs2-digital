# Production stack: app + PostgreSQL + Caddy (automatic HTTPS).
#   cp .env.example .env
#   docker compose up -d
# Update:  git pull && docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concurs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concurs-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-concurs}
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only reachable on the internal Docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: concurs-app:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-concurs}:${POSTGRES_PASSWORD:-concurs-change-me}@db:5432/${POSTGRES_DB:-concurs}
      DOMAIN: ${DOMAIN:-localhost}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-3}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=warn}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/concurs", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

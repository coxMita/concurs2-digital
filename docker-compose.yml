# Production stack: app + PostgreSQL + Caddy (automatic HTTPS).
#   cp .env.example .env
#   docker compose up -d
# Update:  git pull && docker compose up -d --build

services:
  # One-shot: fills empty POSTGRES_PASSWORD / SETUP_TOKEN in .env with random values.
  init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "/init-secrets.sh"]
    volumes:
      - ./.env:/work/.env
      - ./scripts/init-secrets.sh:/init-secrets.sh:ro

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concurs}
      POSTGRES_DB: ${POSTGRES_DB:-concurs}
    # The password is read from .env at start-up (not interpolated by compose), so the
    # value generated by `init` on the very first run is used.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export POSTGRES_PASSWORD="$$(sed -n 's/^POSTGRES_PASSWORD=//p' /run/concurs.env | tail -n 1 | tr -d '\r')";
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./.env:/run/concurs.env:ro
    # No published port: only reachable on the internal Docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      init:
        condition: service_completed_successfully

  app:
    build: .
    restart: unless-stopped
    # Secrets (POSTGRES_PASSWORD, SETUP_TOKEN) are read by the app from the mounted .env.
    environment:
      DB_HOST: db
      DOMAIN: ${DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-3}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=warn}
    volumes:
      - uploads:/data/uploads
      - ./.env:/app/.env:ro
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/concurs", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

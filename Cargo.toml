[package]
name = "concurs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "compression-br", "compression-gzip", "set-header", "trace", "limit", "timeout"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate", "derive", "sqlx-toml"] }
askama = "0.16"
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core", "signed"] }
tower-sessions-sqlx-store = { version = "0.16", features = ["postgres"] }
argon2 = "0.6"
rand = "0.10"
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
moka = { version = "0.12", features = ["future", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
time = "0.3"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
